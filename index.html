<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Písmena</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #letter {
      color: #ffffff;
      font-size: min(80vw, 80vh);
      font-weight: bold;
      line-height: 1;
      user-select: none;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.1s ease, transform 0.15s ease;
    }

    #letter.visible {
      opacity: 1;
      transform: scale(1);
    }

    #hint {
      position: fixed;
      bottom: 2rem;
      color: #555577;
      font-size: 1rem;
      letter-spacing: 0.05em;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    #hint.hidden {
      opacity: 0;
    }

    /* Přepínač klávesnice */
    #kbd-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #555577;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    #kbd-toggle:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    #kbd-toggle.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    #kbd-toggle svg {
      width: 1.4rem;
      height: 1.4rem;
    }


  </style>
</head>
<body>
  <div id="letter"></div>
  <div id="hint">Stiskni klávesu A–Z</div>

  <button id="kbd-toggle" aria-label="Přepnout klávesnici" data-tooltip="Klávesnice skrytá">
    <!-- ikona klávesnice -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="13" rx="2"/>
      <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h.01M12 14h.01M16 14h.01M6 14h.01M18 14h.01"/>
      <path d="M9 17h6"/>
    </svg>
  </button>

  <!-- Input pro zachycení fyzické klávesnice na mobilu -->
  <input id="capture" type="text" inputmode="none" autocomplete="off"
    autocorrect="off" autocapitalize="off" spellcheck="false"
    aria-hidden="true"
    style="position:fixed;opacity:0;width:1px;height:1px;top:0;left:0;border:none;outline:none;pointer-events:none;" />

  <script>
    const letterEl  = document.getElementById('letter');
    const hintEl    = document.getElementById('hint');
    const captureEl = document.getElementById('capture');
    const toggleBtn = document.getElementById('kbd-toggle');

    let hideTimer  = null;
    let hintHidden = false;

    // --- Stav klávesnice ---
    // false = skrytá (inputmode="none"), true = viditelná (inputmode="text")
    let kbdVisible = localStorage.getItem('kbdVisible') === 'true';

    function applyKbdMode() {
      if (kbdVisible) {
        captureEl.inputMode = 'text';
        toggleBtn.classList.add('active');
        toggleBtn.dataset.tooltip = 'Klávesnice viditelná';
        toggleBtn.setAttribute('aria-label', 'Skrýt klávesnici');
      } else {
        captureEl.inputMode = 'none';
        toggleBtn.classList.remove('active');
        toggleBtn.dataset.tooltip = 'Klávesnice skrytá';
        toggleBtn.setAttribute('aria-label', 'Zobrazit klávesnici');
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // nezpůsobí ensureFocus hned po kliknutí
      kbdVisible = !kbdVisible;
      localStorage.setItem('kbdVisible', kbdVisible);
      applyKbdMode();
      // Po přepnutí dej fokus na input (otevře/zavře klávesnici)
      captureEl.blur();
      setTimeout(() => captureEl.focus({ preventScroll: true }), 50);
    });

    applyKbdMode();

    // --- Česká jména písmen při hláskování ---
    const letterNames = {
      A: 'a',  B: 'bé',  C: 'cé',  D: 'dé',  E: 'e',
      F: 'ef', G: 'gé',  H: 'há',  I: 'i',   J: 'jé',
      K: 'ká', L: 'el',  M: 'em',  N: 'en',  O: 'o',
      P: 'pé', Q: 'kvé', R: 'er',  S: 'es',  T: 'té',
      U: 'u',  V: 've',  W: 'dvojité ve', X: 'iks', Y: 'ypsilon', Z: 'zet'
    };

    function showLetter(char) {
      letterEl.classList.remove('visible');
      letterEl.textContent = char;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          letterEl.classList.add('visible');
        });
      });

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(letterNames[char] || char);
        utt.lang = 'cs-CZ';
        utt.rate = 0.8;
        window.speechSynthesis.speak(utt);
      }

      if (!hintHidden) {
        hintEl.classList.add('hidden');
        hintHidden = true;
      }

      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        letterEl.classList.remove('visible');
      }, 3000);
    }

    // --- Fokus ---
    function ensureFocus() {
      captureEl.focus({ preventScroll: true });
    }

    document.addEventListener('click', ensureFocus);
    document.addEventListener('touchend', ensureFocus);
    window.addEventListener('load', ensureFocus);

    captureEl.addEventListener('blur', () => {
      setTimeout(ensureFocus, 50);
    });

    // --- Vstup z klávesnice ---
    captureEl.addEventListener('input', () => {
      const val = captureEl.value;
      captureEl.value = '';
      if (!val) return;
      const char = val[val.length - 1];
      if (/^[a-zA-Z]$/.test(char)) showLetter(char.toUpperCase());
    });

    document.addEventListener('keydown', (e) => {
      if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      if (/^[a-zA-Z]$/.test(e.key)) showLetter(e.key.toUpperCase());
    });

    // --- Visual viewport — přizpůsobení při zobrazení softwarové klávesnice ---
    function updateViewport() {
      const vv = window.visualViewport;
      if (!vv) return;
      // Posuň a ořízni body na viditelnou oblast
      document.body.style.height = vv.height + 'px';
      document.body.style.top = vv.offsetTop + 'px';
      document.body.style.left = vv.offsetLeft + 'px';
      document.body.style.position = 'fixed';
      document.body.style.width = vv.width + 'px';
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewport);
      window.visualViewport.addEventListener('scroll', updateViewport);
      updateViewport();
    }

    // --- Service worker ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
